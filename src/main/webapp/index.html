<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Відгуки</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    input { padding: .4rem; }
    li { margin: .3rem 0; }
    small { color: #777; }
  </style>
</head>
<body>
<h2>Відгуки</h2>
<form id="f" style="margin-bottom:1rem">
  <input name="author" placeholder="Ваше ім'я" required maxlength="64">
  <input name="text" placeholder="Ваш відгук" required maxlength="1000" style="width:50%">
  <button>Надіслати</button>
</form>
<ul id="list"></ul>

<script>
  // Відносний шлях — працює і з contextPath "/", і з "/<artifactId>/"
  const API = 'comments';

  async function load() {
    const r = await fetch(API);
    const a = await r.json();
    const ul = document.getElementById('list');
    ul.innerHTML = '';
    if (!a.length) { ul.innerHTML = '<li>Ще немає відгуків</li>'; return; }
    a.forEach(c => {
      const li = document.createElement('li');
      li.textContent = `${c.author}: ${c.text} `;
      const s = document.createElement('small');
      s.textContent = new Date(c.createdAt).toLocaleString();
      li.appendChild(s);
      ul.appendChild(li);
    });
  }

  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    // URLSearchParams -> application/x-www-form-urlencoded,
    // щоб сервлет міг прочитати поля через req.getParameter()
    const body = new URLSearchParams(new FormData(e.target));
    const r = await fetch(API, { method: 'POST', body });
    if (r.ok) { e.target.reset(); load(); }
    else alert('Помилка ' + r.status + ': ' + (await r.text()));
  });

  load();
</script>
</body>
</html>
