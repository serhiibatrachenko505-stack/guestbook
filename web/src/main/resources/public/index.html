<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Каталог книг</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Каталог книг</h1>

<form id="search" class="row">
  <input name="q" placeholder="Пошук за назвою або автором">
  <select name="sort">
    <option value="id,desc">Нові першими</option>
    <option value="title,asc">Назва А→Я</option>
    <option value="author,asc">Автор А→Я</option>
    <option value="year,desc">Рік ↓</option>
    <option value="year,asc">Рік ↑</option>
  </select>
  <select name="size">
    <option>5</option><option selected>10</option><option>20</option>
  </select>
  <button>Знайти</button>
</form>

<ul id="list"></ul>
<div class="row">
  <button id="prev">← Назад</button>
  <span id="info"></span>
  <button id="next">Далі →</button>
</div>

<h3>Додати книгу</h3>
<form id="add" class="row">
  <input name="title" placeholder="Назва" required maxlength="255">
  <input name="author" placeholder="Автор" required maxlength="255">
  <input name="pubYear" type="number" placeholder="Рік" required style="width:6rem">
  <button>Додати</button>
</form>
<p id="error" class="error"></p>

<script>
  let page = 0, totalPages = 0;
  const form = document.getElementById('search');
  const errorBox = document.getElementById('error');

  async function load() {
    const params = new URLSearchParams(new FormData(form));
    params.set('page', page);
    const r = await fetch('/api/books?' + params);
    const data = await r.json();
    if (!r.ok) { errorBox.textContent = data.status + ': ' + data.message; return; }
    errorBox.textContent = '';

    const ul = document.getElementById('list');
    ul.innerHTML = '';
    if (!data.items.length) ul.innerHTML = '<li>Нічого не знайдено</li>';
    data.items.forEach(b => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '/book.html?id=' + b.id;
      a.textContent = `${b.title} — ${b.author} (${b.pubYear})`;
      li.appendChild(a);
      ul.appendChild(li);
    });

    totalPages = data.totalPages;
    document.getElementById('info').textContent =
      `Сторінка ${data.page + 1} з ${Math.max(totalPages, 1)} (усього ${data.total})`;
    document.getElementById('prev').disabled = page === 0;
    document.getElementById('next').disabled = page + 1 >= totalPages;
  }

  form.addEventListener('submit', e => { e.preventDefault(); page = 0; load(); });
  document.getElementById('prev').onclick = () => { page--; load(); };
  document.getElementById('next').onclick = () => { page++; load(); };

  document.getElementById('add').addEventListener('submit', async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    f.pubYear = Number(f.pubYear);
    const r = await fetch('/api/books', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(f)
    });
    if (r.ok) { e.target.reset(); page = 0; load(); }
    else { const err = await r.json(); errorBox.textContent = err.status + ': ' + err.message; }
  });

  load();
</script>
</body>
</html>
