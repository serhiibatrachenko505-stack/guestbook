<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/header :: head(${username})}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<p><a th:href="@{/users}" th:text="#{label.backToUsers}">← До користувачів</a></p>

<h1>
    <span th:text="#{title.userComments}">Коментарі користувача</span>:
    <span th:text="${username}">Олена</span>
</h1>
<p class="meta">
    <span th:text="#{label.role}">Роль</span>: <span th:text="${user.role}">USER</span> ·
    <span th:text="#{label.commentsCount}">Відгуків</span>: <span th:text="${#lists.size(comments)}">3</span>
</p>

<p class="empty" th:if="${#lists.isEmpty(comments)}" th:text="#{label.noComments}">Ще немає відгуків</p>

<ul class="user-comments" th:unless="${#lists.isEmpty(comments)}">
    <li th:each="c : ${comments}">
        <p><small th:text="${@dates.format(c.createdAt)}">20.11.2026 10:00</small></p>
        <p th:text="${c.text}">Класика, яку варто перечитувати</p>
        <p>
            <span th:text="#{label.book}">Книга</span>:
            <a th:href="@{/books/{id}(id=${c.bookId})}"
               th:text="${books[c.bookId].title} + ' — ' + ${books[c.bookId].author}">Кобзар — Тарас Шевченко</a>
        </p>
    </li>
</ul>

<footer th:replace="~{fragments/header :: footer}"></footer>
</body>
</html>
