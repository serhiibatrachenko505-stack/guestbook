<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  Спільні фрагменти сторінок. Підключення:
    <head   th:replace="~{fragments/header :: head(#{title.books})}"></head>
    <header th:replace="~{fragments/header :: header}"></header>
    <footer th:replace="~{fragments/header :: footer}"></footer>
  sec:authorize / sec:authentication — теги Thymeleaf Extras Spring Security.
-->

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <title th:text="${title} + ' · ' + #{app.name}">Сторінка · MPF</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<header th:fragment="header" class="site-header">
    <nav class="row">
        <!-- для авторизованих -->
        <th:block sec:authorize="isAuthenticated()">
            <a th:href="@{/books}" th:text="#{nav.books}">Книги</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/books/add}" th:text="#{nav.addBook}">Додати книгу</a>
            <a th:href="@{/users}" th:text="#{nav.users}">Користувачі</a>
            <a th:href="@{/api/books}" th:text="#{nav.api}">REST API</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/h2-console}">H2 Console</a>
        </th:block>

        <span class="spacer"></span>

        <a href="?lang=uk" th:classappend="${#locale.language == 'uk'} ? 'active'">UA</a>
        <a href="?lang=en" th:classappend="${#locale.language == 'en'} ? 'active'">EN</a>

        <!-- поточний користувач, роль і вихід -->
        <th:block sec:authorize="isAuthenticated()">
            <span class="user">
                <span th:text="#{nav.signedInAs}">Ви увійшли як</span>
                <b sec:authentication="name">admin</b>
                <span class="badge" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                <span class="badge user-badge" sec:authorize="hasRole('USER')">USER</span>
            </span>
            <form th:action="@{/logout}" method="post" class="inline">
                <button type="submit" th:text="#{nav.logout}">Вийти</button>
            </form>
        </th:block>

        <!-- для гостей -->
        <th:block sec:authorize="isAnonymous()">
            <a th:href="@{/login}" th:text="#{nav.login}">Увійти</a>
            <a th:href="@{/register}" th:text="#{nav.register}">Реєстрація</a>
        </th:block>
    </nav>
</header>

<footer th:fragment="footer" class="site-footer">
    <small th:text="#{footer.text}">MPF Labs · Spring MVC + Thymeleaf</small>
</footer>

</body>
</html>
