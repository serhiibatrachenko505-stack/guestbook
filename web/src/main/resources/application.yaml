# ---------- стандартні параметри Spring Boot ----------
spring:
  application:
    name: library-app
  main:
    banner-mode: console

  # ===== База даних (ЛР8): H2 + JPA/Hibernate + Flyway =====
  # новий файл БД: стара library.mv.db створена без Flyway і з іншою схемою
  datasource:
    url: jdbc:h2:file:./data/library-jpa;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none            # схему створює лише Flyway, Hibernate її не змінює
    show-sql: true              # SQL-запити Hibernate у консолі
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: true             # http://localhost:8080/h2-console
      path: /h2-console

  # файли локалізації: messages.properties (uk), messages_en.properties (en)
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false   # невідома мова -> messages.properties (українська)

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false          # шаблони перечитуються без перезапуску (зручно під час розробки)

  # ===== Gmail SMTP (ЛР7) =====
  mail:
    host: smtp.gmail.com
    port: 587
    username: serhiibatrachenko505@gmail.com
    password: ${MAIL_APP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: smtp.gmail.com

  # ===== FreeMarker (ЛР7): лише для листів, сторінки лишаються на Thymeleaf =====
  freemarker:
    enabled: false
    charset: UTF-8

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    root: INFO
    sumdu.edu.ua: INFO

# ---------- власні параметри застосунку (LibraryProperties) ----------
library:
  title: "Каталог книг"
  version: "9.0"
  books:
    default-page-size: 10
  comments:
    delete-window-hours: 24

# ---------- адреса отримувача листів (ЛР7) ----------
app:
  # адреса застосунку для посилань у листах (підтвердження акаунта)
  base-url: http://localhost:8080
  mail:
    admin: serhiibatrachenko505@gmail.com